name: CI

# PG-0 — the first CI this repository has. There was no `.github/` at all before it.
#
# Order is the one brief 30 set: typecheck → vitest → build → Playwright (browsers
# installed) → axe on /dashboard.
#
# `reuseExistingServer: true` in playwright.config.ts is deliberately left alone
# (landmine 2): it keeps local dev fast, and on a CI runner there is no existing
# server to reuse, so Playwright starts its own. Nothing here changes that behaviour
# for humans.
#
# The axe spec runs BOTH ways, per the orchestrator's ruling: it is part of the
# default `npm run test:e2e` so a Worker sees an a11y break locally, and it is a
# separate CI step so a failure reads as an a11y failure instead of being lost in the
# functional count. The functional step therefore greps it OUT, so the two steps
# together cover every spec exactly once and never run the axe scan twice.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck · unit · build · e2e · axe
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        # --with-deps is what makes this green on a clean clone: the runner image has
        # the browser binaries cached but not the system libraries every one of them needs.
        run: npx playwright install --with-deps chromium

      - name: E2E — functional
        run: npx playwright test --grep-invert axe-core

      - name: E2E — axe accessibility gate (/dashboard)
        # Fails on `serious` and `critical` only. minor/moderate are printed by the spec
        # and deliberately do not fail the gate (landmine 3).
        run: npx playwright test e2e/a11y.spec.ts

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
